name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Production Deployment
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://zemo-official.vercel.app
    steps:
      - name: Confirm Production Deployment
        run: |
          echo "🚀 Zemo Production is Active!"
          echo "🌐 Frontend URL: https://zemo-official.vercel.app"
          echo "⚡ Backend API: https://zemo-backend.onrender.com"
